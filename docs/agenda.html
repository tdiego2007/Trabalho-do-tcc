<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda e Eventos - Clube do Livro IFRN</title>
  <link rel="stylesheet" href="estilo.css">

</head>
<body>

<header>
  <h2>📅 Agenda e Eventos</h2>
  <p>Clube do Livro IFRN - Acompanhe nossos encontros, oficinas e palestras</p>
  <a href="perfil_do_aluno.html" class="perfil-topo">
    👤 Meu Perfil
  </a>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="livros(1).html">Biblioteca</a>
  <a href="agenda.html" class="active">Agenda</a>
  <a href="discussoes.html">Discussões</a>
  <a href="cadastro.html">Cadastre-se</a>
  <a href="login.html">Entrar</a>
</nav>

<div class="container">

  <!-- Formulário de Cadastro de Eventos -->
  <div class="card">
    <h3>➕ Cadastrar Novo Evento</h3>
    <form id="formEvento" onsubmit="adicionarEvento(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="titulo">Título do Evento *</label>
          <input type="text" id="titulo" placeholder="Ex: Roda de Leitura: Dom Casmurro" required>
        </div>
        <div class="form-group">
          <label for="tipo">Tipo de Evento *</label>
          <select id="tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="Encontro">Encontro / Roda de Leitura</option>
            <option value="Oficina">Oficina Literária</option>
            <option value="Palestra">Palestra / Bate-papo</option>
            <option value="Debate">Debate de Livro do Mês</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data">Data e Horário *</label>
          <input type="datetime-local" id="data" required>
        </div>
        <div class="form-group">
          <label for="local">Local / Link *</label>
          <input type="text" id="local" placeholder="Ex: Biblioteca Central ou Google Meet" required>
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição / Pauta</label>
        <textarea id="descricao" rows="3" placeholder="Detalhes do encontro, capítulos a serem lidos, convidados..."></textarea>
      </div>

      <button type="submit">Cadastrar Evento</button>
    </form>
  </div>

  <!-- Lista de Eventos e Calendário -->
  <div class="card">
    <div class="filter-header">
      <h3>📆 Próximos Eventos & Encontros</h3>
      <div class="filter-controls">
        <label for="filtroTipo">Filtrar por:</label>
        <select id="filtroTipo" onchange="mostrarEventos()">
          <option value="todos">Todos os Tipos</option>
          <option value="Encontro">Encontros</option>
          <option value="Oficina">Oficinas</option>
          <option value="Palestra">Palestras</option>
          <option value="Debate">Debates</option>
        </select>
      </div>
    </div>

    <div id="listaEventos" class="evento-list">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </div>

</div>

<footer>
  <p>Projeto acadêmico - Clube do Livro IFRN</p>
</footer>

<script src="agenda.js"></script>

</body>
</html>
