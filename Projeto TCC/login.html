<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Login</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f1e9;}
header{background:#5c3d2e;color:#fff;padding:15px;text-align:center;}
nav{background:#8b5e3c;padding:10px;text-align:center;}
nav a{color:#fff;text-decoration:none;margin:0 10px;font-weight:bold;}
.container{max-width:420px;margin:40px auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;}
button{width:100%;padding:10px;background:#5c3d2e;color:#fff;border:none;border-radius:5px;cursor:pointer;}
button:hover{background:#7a5238;}
</style></head>
<body>
<header><h2>Clube do Livro IFRN</h2></header>
<nav><a href="index.html">Início</a> <a href="cadastro.html">Cadastro</a></nav>
<div class="container">
<h3>Login</h3>
<input id="usuario" placeholder="E-mail ou matrícula">
<input id="senha" type="password" placeholder="Senha">
<p><a href="#">Esqueci minha senha</a></p>
<button onclick="entrar()">Entrar</button>
</div>
<script>
function entrar(){
let us=JSON.parse(localStorage.getItem("usuarios"))||[];
let u=us.find(x=>(x.email===usuario.value||x.matricula===usuario.value)&&x.senha===senha.value);
if(!u){alert("Dados inválidos.");return;}
localStorage.setItem("usuarioLogado",JSON.stringify(u));
alert("Login realizado!");
location.href="index.html";
}
</script>
</body></html>
