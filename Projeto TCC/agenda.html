<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda e Eventos - Clube do Livro IFRN</title>
  <link rel="stylesheet" href="estilo.css">

</head>
<body>

<header>
  <h2>📅 Agenda e Eventos</h2>
  <p>Clube do Livro IFRN - Acompanhe nossos encontros, oficinas e palestras</p>
  <a href="perfil_do_aluno.html" class="perfil-topo">
    👤 Meu Perfil
  </a>
</header>

<nav>
  <a href="index.html">Início</a>
  <a href="livros(1).html">Biblioteca</a>
  <a href="agenda.html" class="active">Agenda</a>
  <a href="discussoes.html">Discussões</a>
  <a href="cadastro.html">Cadastre-se</a>
  <a href="login.html">Entrar</a>
</nav>

<div class="container">

  <!-- Formulário de Cadastro de Eventos -->
  <div class="card">
    <h3>➕ Cadastrar Novo Evento</h3>
    <form id="formEvento" onsubmit="adicionarEvento(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="titulo">Título do Evento *</label>
          <input type="text" id="titulo" placeholder="Ex: Roda de Leitura: Dom Casmurro" required>
        </div>
        <div class="form-group">
          <label for="tipo">Tipo de Evento *</label>
          <select id="tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="Encontro">Encontro / Roda de Leitura</option>
            <option value="Oficina">Oficina Literária</option>
            <option value="Palestra">Palestra / Bate-papo</option>
            <option value="Debate">Debate de Livro do Mês</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data">Data e Horário *</label>
          <input type="datetime-local" id="data" required>
        </div>
        <div class="form-group">
          <label for="local">Local / Link *</label>
          <input type="text" id="local" placeholder="Ex: Biblioteca Central ou Google Meet" required>
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição / Pauta</label>
        <textarea id="descricao" rows="3" placeholder="Detalhes do encontro, capítulos a serem lidos, convidados..."></textarea>
      </div>

      <button type="submit">Cadastrar Evento</button>
    </form>
  </div>

  <!-- Lista de Eventos e Calendário -->
  <div class="card">
    <div class="filter-header">
      <h3>📆 Próximos Eventos & Encontros</h3>
      <div class="filter-controls">
        <label for="filtroTipo">Filtrar por:</label>
        <select id="filtroTipo" onchange="mostrarEventos()">
          <option value="todos">Todos os Tipos</option>
          <option value="Encontro">Encontros</option>
          <option value="Oficina">Oficinas</option>
          <option value="Palestra">Palestras</option>
          <option value="Debate">Debates</option>
        </select>
      </div>
    </div>

    <div id="listaEventos" class="evento-list">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </div>

</div>

<footer>
  <p>Projeto acadêmico - Clube do Livro IFRN</p>
</footer>

<script>
  // Eventos iniciais demonstrativos caso o localStorage esteja vazio
  const eventosIniciais = [
    {
      id: "evt_1",
      titulo: "Discussão do Livro do Mês: 1984",
      tipo: "Debate",
      data: "2026-08-15T14:30",
      local: "Biblioteca do IFRN - Sala 04",
      descricao: "Encontro presencial para debater as reflexões sobre totalitarismo, vigilância e liberdade na obra de George Orwell.",
      confirmados: 6
    },
    {
      id: "evt_2",
      titulo: "Oficina: Como Escrever Resenhas Críticas",
      tipo: "Oficina",
      data: "2026-08-20T16:00",
      local: "Laboratório de Informática 02",
      descricao: "Aprenda técnicas para estruturar resenhas literárias e compartilhar sua opinião no fórum do clube.",
      confirmados: 9
    },
    {
      id: "evt_3",
      titulo: "Palestra: A Literatura Potiguar Contemporânea",
      tipo: "Palestra",
      data: "2026-08-28T10:00",
      local: "Auditório Principal do IFRN",
      descricao: "Bate-papo exclusivo sobre o processo criativo e a produção literária no Rio Grande do Norte.",
      confirmados: 14
    }
  ];

  function inicializarEventos() {
    if (!localStorage.getItem("eventos_clube")) {
      localStorage.setItem("eventos_clube", JSON.stringify(eventosIniciais));
    }
  }

  function adicionarEvento(e) {
    e.preventDefault();
    
    let titulo = document.getElementById("titulo").value.trim();
    let tipo = document.getElementById("tipo").value;
    let data = document.getElementById("data").value;
    let local = document.getElementById("local").value.trim();
    let descricao = document.getElementById("descricao").value.trim();

    if (!titulo || !tipo || !data || !local) return;

    let novoEvento = {
      id: "evt_" + Date.now(),
      titulo: titulo,
      tipo: tipo,
      data: data,
      local: local,
      descricao: descricao,
      confirmados: 0
    };

    let eventos = JSON.parse(localStorage.getItem("eventos_clube")) || [];
    eventos.push(novoEvento);
    localStorage.setItem("eventos_clube", JSON.stringify(eventos));

    document.getElementById("formEvento").reset();
    mostrarEventos();
  }

  function formatarDataHora(strData) {
    if (!strData) return "";
    let d = new Date(strData);
    if (isNaN(d.getTime())) return strData;
    let dia = String(d.getDate()).padStart(2, '0');
    let mes = String(d.getMonth() + 1).padStart(2, '0');
    let ano = d.getFullYear();
    let hora = String(d.getHours()).padStart(2, '0');
    let min = String(d.getMinutes()).padStart(2, '0');
    return `${dia}/${mes}/${ano} às ${hora}:${min}h`;
  }

  function togglePresenca(idEvento) {
    let confirmacoes = JSON.parse(localStorage.getItem("presencas_confirmadas")) || {};
    let eventos = JSON.parse(localStorage.getItem("eventos_clube")) || [];

    let index = eventos.findIndex(e => e.id === idEvento);
    if (index === -1) return;

    if (confirmacoes[idEvento]) {
      confirmacoes[idEvento] = false;
      eventos[index].confirmados = Math.max(0, (eventos[index].confirmados || 1) - 1);
    } else {
      confirmacoes[idEvento] = true;
      eventos[index].confirmados = (eventos[index].confirmados || 0) + 1;
    }

    localStorage.setItem("presencas_confirmadas", JSON.stringify(confirmacoes));
    localStorage.setItem("eventos_clube", JSON.stringify(eventos));
    mostrarEventos();
  }

  function excluirEvento(idEvento) {
    if (!confirm("Tem certeza que deseja excluir este evento?")) return;

    let eventos = JSON.parse(localStorage.getItem("eventos_clube")) || [];
    eventos = eventos.filter(e => e.id !== idEvento);
    localStorage.setItem("eventos_clube", JSON.stringify(eventos));
    mostrarEventos();
  }

  function mostrarEventos() {
    let lista = document.getElementById("listaEventos");
    let filtro = document.getElementById("filtroTipo").value;
    let eventos = JSON.parse(localStorage.getItem("eventos_clube")) || [];
    let confirmacoes = JSON.parse(localStorage.getItem("presencas_confirmadas")) || {};

    // Ordenar por data
    eventos.sort((a, b) => new Date(a.data) - new Date(b.data));

    // Filtrar
    if (filtro !== "todos") {
      eventos = eventos.filter(e => e.tipo === filtro);
    }

    if (eventos.length === 0) {
      lista.innerHTML = '<p class="sem-eventos">Nenhum evento encontrado para esta categoria.</p>';
      return;
    }

    lista.innerHTML = "";

    eventos.forEach(function(evento) {
      let isConfirmado = !!confirmacoes[evento.id];
      let badgeClass = "badge-" + (evento.tipo || "Encontro");

      let div = document.createElement("div");
      div.className = "evento-item";

      div.innerHTML = `
        <span class="badge-tipo ${badgeClass}">${evento.tipo}</span>
        <div class="evento-header">
          <h4 class="evento-titulo">${evento.titulo}</h4>
          <button onclick="excluirEvento('${evento.id}')" class="btn-excluir">Excluir</button>
        </div>
        <div class="evento-meta">
          📍 Local: ${evento.local} | 🕒 ${formatarDataHora(evento.data)}
        </div>
        <p class="evento-desc">${evento.descricao || "Sem descrição informada."}</p>
        <div class="evento-actions">
          <span class="presenca-status">👥 Presenças confirmadas: <strong>${evento.confirmados || 0}</strong></span>
          <button onclick="togglePresenca('${evento.id}')" class="${isConfirmado ? 'btn-confirmado' : 'btn-presenca'}">
            ${isConfirmado ? '✔ Presença Confirmada' : '✋ Confirmar Presença'}
          </button>
        </div>
      `;

      lista.appendChild(div);
    });
  }

  window.onload = function() {
    inicializarEventos();
    mostrarEventos();
  };
</script>

</body>
</html>
